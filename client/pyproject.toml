[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "evdev==1.9.2",
    "pynput==1.8.1",
    "python-xlib==0.33",
    "six==1.17.0",
]

[project.optional-dependencies]
testing = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[tool.setuptools]
packages = ["client"]
package-dir = { "client" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/venv/*", "*/build/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

