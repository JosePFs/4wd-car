[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "config_common"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv",
]

[tool.setuptools]
packages = ["config_common"]
package-dir = { "config_common" = "." }

